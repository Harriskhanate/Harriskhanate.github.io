<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter PIN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .lock-container {
            text-align: center;
            padding: 40px 30px;
            max-width: 340px;
            width: 100%;
        }

        .lock-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lock-icon svg {
            width: 32px;
            height: 32px;
            fill: #fff;
        }

        .lock-title {
            color: #fff;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .lock-subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .pin-dots {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 32px;
        }

        .pin-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4);
            background: transparent;
            transition: all 0.2s ease;
        }

        .pin-dot.filled {
            background: #fff;
            border-color: #fff;
        }

        .pin-dot.error {
            border-color: #ff4757;
            background: #ff4757;
            animation: shake 0.5s ease;
        }

        .pin-dot.success {
            border-color: #2ed573;
            background: #2ed573;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 280px;
            margin: 0 auto;
        }

        .key {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 28px;
            font-weight: 300;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            transition: all 0.15s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .key:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .key:active {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(0.95);
        }

        .key.empty {
            border: none;
            background: none;
            cursor: default;
        }

        .key.empty:hover {
            background: none;
        }

        .key.delete {
            font-size: 16px;
            border: none;
            background: none;
        }

        .key.delete:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .error-message {
            color: #ff4757;
            font-size: 13px;
            margin-top: 20px;
            min-height: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .error-message.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="lock-container">
        <div class="lock-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/>
            </svg>
        </div>
        <div class="lock-title">Locked</div>
        <div class="lock-subtitle">Enter 4-digit PIN to continue</div>

        <div class="pin-dots">
            <div class="pin-dot" id="dot-0"></div>
            <div class="pin-dot" id="dot-1"></div>
            <div class="pin-dot" id="dot-2"></div>
            <div class="pin-dot" id="dot-3"></div>
        </div>

        <div class="keypad">
            <button class="key" data-num="1">1</button>
            <button class="key" data-num="2">2</button>
            <button class="key" data-num="3">3</button>
            <button class="key" data-num="4">4</button>
            <button class="key" data-num="5">5</button>
            <button class="key" data-num="6">6</button>
            <button class="key" data-num="7">7</button>
            <button class="key" data-num="8">8</button>
            <button class="key" data-num="9">9</button>
            <button class="key empty"></button>
            <button class="key" data-num="0">0</button>
            <button class="key delete" id="deleteBtn">&#9003;</button>
        </div>

        <div class="error-message" id="errorMsg">Incorrect PIN. Try again.</div>
    </div>

    <script>
        (function() {
            var PIN_HASH = '03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4';
            var enteredPin = '';
            var maxLength = 4;
            var isLocked = false;

            var dots = [];
            for (var i = 0; i < maxLength; i++) {
                dots.push(document.getElementById('dot-' + i));
            }
            var errorMsg = document.getElementById('errorMsg');

            async function sha256(message) {
                var msgBuffer = new TextEncoder().encode(message);
                var hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                var hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
            }

            function updateDots() {
                for (var i = 0; i < maxLength; i++) {
                    dots[i].className = 'pin-dot' + (i < enteredPin.length ? ' filled' : '');
                }
            }

            function showError() {
                dots.forEach(function(dot) { dot.className = 'pin-dot error'; });
                errorMsg.className = 'error-message visible';
                isLocked = true;
                setTimeout(function() {
                    enteredPin = '';
                    updateDots();
                    errorMsg.className = 'error-message';
                    isLocked = false;
                }, 1000);
            }

            function showSuccess() {
                dots.forEach(function(dot) { dot.className = 'pin-dot success'; });
                setTimeout(function() {
                    window.location.href = 'content.html';
                }, 400);
            }

            async function checkPin() {
                var hash = await sha256(enteredPin);
                if (hash === PIN_HASH) {
                    showSuccess();
                } else {
                    showError();
                }
            }

            function addDigit(num) {
                if (isLocked || enteredPin.length >= maxLength) return;
                enteredPin += num;
                updateDots();
                if (enteredPin.length === maxLength) {
                    checkPin();
                }
            }

            function deleteDigit() {
                if (isLocked || enteredPin.length === 0) return;
                enteredPin = enteredPin.slice(0, -1);
                updateDots();
            }

            document.querySelectorAll('.key[data-num]').forEach(function(key) {
                key.addEventListener('click', function() {
                    addDigit(this.getAttribute('data-num'));
                });
            });

            document.getElementById('deleteBtn').addEventListener('click', deleteDigit);

            document.addEventListener('keydown', function(e) {
                if (e.key >= '0' && e.key <= '9') {
                    addDigit(e.key);
                } else if (e.key === 'Backspace') {
                    deleteDigit();
                }
            });
        })();
    </script>
</body>
</html>
